<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Egor's AI agent room</title>
  <desc id="desc">A dark systems map with an orchestrator connected to research, engineering, product review and memory nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C18"/>
      <stop offset="0.5" stop-color="#12112B"/>
      <stop offset="1" stop-color="#080C18"/>
    </linearGradient>
    <linearGradient id="core" x1="530" y1="130" x2="670" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="line" x1="200" y1="100" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <ellipse cx="600" cy="205" rx="230" ry="150" fill="#7C3AED" fill-opacity="0.08" filter="url(#soft)"/>

  <path d="M34 72H1166" stroke="#334155" stroke-opacity="0.55"/>
  <text x="40" y="45" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">EGOR / AGENT ROOM</text>
  <text x="40" y="62" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">ORCHESTRATION LAYER · BUILDING SYSTEMS THAT KEEP CONTEXT</text>
  <circle cx="1082" cy="43" r="5" fill="#4ADE80" filter="url(#glow)"/>
  <text x="1096" y="47" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end" letter-spacing="1">READY</text>

  <g stroke="url(#line)" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.9">
    <path d="M516 184L258 142"/>
    <path d="M516 216L258 280"/>
    <path d="M684 184L942 142"/>
    <path d="M684 216L942 280"/>
    <path d="M600 270L600 354"/>
  </g>
  <g fill="#38BDF8" filter="url(#glow)">
    <circle cx="392" cy="164" r="3"/><circle cx="808" cy="164" r="3"/>
    <circle cx="392" cy="246" r="3"/><circle cx="808" cy="246" r="3"/>
    <circle cx="600" cy="314" r="3"/>
  </g>

  <g>
    <circle cx="600" cy="205" r="84" fill="#0F172A" stroke="url(#core)" stroke-width="2"/>
    <circle cx="600" cy="205" r="63" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="2 8"/>
    <circle cx="600" cy="205" r="12" fill="url(#core)" filter="url(#glow)"/>
    <text x="600" y="181" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" letter-spacing="2">CORE</text>
    <text x="600" y="207" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle" font-weight="700">ORCHESTRATOR</text>
    <text x="600" y="229" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">plan · route · handoff</text>
  </g>

  <g>
    <rect x="82" y="102" width="230" height="80" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.65"/>
    <circle cx="108" cy="129" r="6" fill="#A78BFA" filter="url(#glow)"/>
    <text x="124" y="133" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">RESEARCH SPIDER</text>
    <text x="105" y="158" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">find · compare · cite</text>
    <text x="292" y="158" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">01</text>
  </g>
  <g>
    <rect x="82" y="240" width="230" height="80" rx="12" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.65"/>
    <circle cx="108" cy="267" r="6" fill="#F472B6" filter="url(#glow)"/>
    <text x="124" y="271" fill="#FBCFE8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">AI RESEARCH</text>
    <text x="105" y="296" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">listen · structure · measure</text>
    <text x="292" y="296" fill="#F472B6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">02</text>
  </g>
  <g>
    <rect x="888" y="102" width="230" height="80" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65"/>
    <circle cx="914" cy="129" r="6" fill="#38BDF8" filter="url(#glow)"/>
    <text x="930" y="133" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">CODEX ENGINEER</text>
    <text x="911" y="158" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">build · test · ship</text>
    <text x="1098" y="158" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">03</text>
  </g>
  <g>
    <rect x="888" y="240" width="230" height="80" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.65"/>
    <circle cx="914" cy="267" r="6" fill="#FBBF24" filter="url(#glow)"/>
    <text x="930" y="271" fill="#FEF3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">PRODUCT REVIEW</text>
    <text x="911" y="296" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">check · explain · approve</text>
    <text x="1098" y="296" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">04</text>
  </g>
  <g>
    <rect x="470" y="350" width="260" height="48" rx="12" fill="#0F172A" stroke="#4ADE80" stroke-opacity="0.65"/>
    <circle cx="493" cy="374" r="5" fill="#4ADE80" filter="url(#glow)"/>
    <text x="507" y="378" fill="#BBF7D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">LIBRARIAN / MEMORY</text>
    <text x="708" y="378" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">05</text>
  </g>

  <text x="40" y="392" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">MYSL × APEX · PERSONAL LAB / PRODUCT WORK</text>
  <text x="1160" y="392" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">v0.1 / SYSTEM MAP</text>
</svg>
